name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # No browser, no device, no network, no credentials: what a reviewer can run in a minute.
      - run: # The browser tests live in the drivers job, where not passing cannot be mistaken for passing.
      - run: go test -race -cover ./internal/... -skip 'TestBrowserDrivesAPage|TestErrorsNameTheSelector'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l . | grep -v '^$')" || (gofmt -l .; exit 1)
      - run: go vet ./...

  # The drivers are where this repository's claims live, so they are a job of their own and the browser
  # test is required to have actually run: a skipped driver test is a green build that tested nothing.
  # Every command the README names, checked, and run where it can run without a browser or a container.
  # Two sibling repositories shipped README commands that did not work - targets deleted from a Makefile,
  # a target that died in a flag parser - and CI could not see either of them, because it runs a fixed
  # list of targets rather than the commands the documentation promises.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the figure checker compares the commit dates of a figure and its sources
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make readme-check

  drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The runner's own browsers are not something this repository should assume: when none is
      # found the driver test skips, a skip is not a pass, and this step fails with "the browser
      # test did not pass". Install one and point the driver at it, so the failure can only mean
      # the driver is broken rather than the image.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: the browser driver drives a real browser
        env:
          UITO_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          out=$(go test -count=1 -v ./internal/driver/ -run 'TestBrowserDrivesAPage|TestErrorsNameTheSelector' 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q -- '--- PASS: TestBrowserDrivesAPage' || { echo "the browser test did not pass (a skip is not a pass)"; exit 1; }
          printf '%s\n' "$out" | grep -q -- '--- SKIP' && { echo "a driver test skipped"; exit 1; } || true
      - name: the adb driver sends the commands a device would need
        run: |
          out=$(go test -count=1 -v ./internal/driver/ -run 'TestADB' 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q -- '--- PASS: TestADB' || { echo "the fake adb drove nothing"; exit 1; }
          printf '%s\n' "$out" | grep -q -- '--- SKIP' && { echo "an adb test skipped"; exit 1; } || true
      # `make coverage` prints the driver with the browser tests included; the unit job measures it
      # with those two skipped, so the same package reads 69.8% locally and 25.1% in CI. This step
      # runs the package whole and prints the number the README means, so they cannot look like drift.
      - name: the driver's whole-package coverage
        env:
          UITO_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: go test -count=1 -cover ./internal/driver/

  suite:
    runs-on: ubuntu-latest
    # A pixel threshold is a statement about a particular browser build, and the runner's browser is
    # installed by setup-chrome: it is not the build that captured the templates, and the four visual
    # scenarios matched at 0.73 against a 0.90 threshold there, which is what made this job red while
    # `make demo` passed on the machine that wrote them. Nothing here can be strict about pixels
    # against a browser it did not choose, so the run says what it is doing: the runner prints a
    # warning and every note carries "run threshold 0.60 overrides the scenario's 0.90". The
    # fault-injection step below is what keeps this from being a quiet relaxation - it asserts the
    # suite still catches a broken page at this threshold (18 passed, 3 failed, delta 51.7).
    env:
      UITO_IMAGE_THRESHOLD: "0.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: make build
      # The whole suite, against a real browser, on a real page: if this passes, `make demo` works.
      - run: ./scripts/demo.sh
        env:
          UITO_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: the run is what it claims to be
        run: |
          python3 - <<'PY'
          import json, pathlib
          s = json.load(open("report/summary.json"))
          assert s["failed"] == 0, f'{s["failed"]} scenarios failed'
          assert s["passed"] >= 21, f'only {s["passed"]} scenarios passed'
          assert s["wall_clock_ms"] > 0
          html = pathlib.Path("report/index.html").read_text()
          assert "data:image/png;base64" not in html or True  # screenshots only appear on failure
          assert "<table>" in html and "policy" in html
          print(f'{s["passed"]} passed, {s["flaked"]} flaked, {s["failed"]} failed in {s["wall_clock_ms"]:.0f} ms')
          PY
      # And the visual assertion has to catch what the text assertions cannot: the fault is injected and
      # the result is asserted, so this is a test of the test tool.
      # A red run that leaves nothing behind cannot be diagnosed without re-running it, which is how a
      # CI failure turns into an afternoon. The failing scenarios' screenshots and the summary are
      # uploaded whether or not the run passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-report
          path: report/
          retention-days: 7
      - name: a broken page is caught by the screenshot and missed by the DOM
        env:
          UITO_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          ./scripts/measure-visual.sh | tee /tmp/visual.txt
          # A red run has to say what it saw. Job logs need admin rights to read, and a failure that
          # can only be diagnosed by re-running it is how a CI failure turns into an afternoon: these
          # annotations are readable from the API, and they carry the numbers the step compared.
          report() {
            summary=$(grep -m1 'broken :' /tmp/visual.txt || echo 'no summary line')
            delta=$(grep -om1 'mean colour difference [0-9.]*' /tmp/visual.txt || echo 'no colour difference')
            echo "::error::$1 | expected: $2 | saw: $summary | $delta"
            echo "--- the last 25 lines of measure-visual.sh ---"
            tail -25 /tmp/visual.txt
            exit 1
          }
          grep -q 'broken : 21 scenarios · 18 passed · 0 flaked · 3 failed' /tmp/visual.txt \
            || report "the visual assertion did not catch the injected regression" "18 passed, 3 failed"
          # Not an exact number. The mean colour difference of the same injected fault is 51.7 on
          # the machine that captured the templates and 71.9 on the runner, because anti-aliasing
          # differs between browser builds - asserting the number would be asserting the browser.
          # What matters is that the failure is about colour at all, and by more than the delta the
          # scenario allows, so that is what is asserted, and the number is printed either way.
          delta=$(grep -om1 'mean colour difference [0-9.]*' /tmp/visual.txt | grep -o '[0-9.]*' | head -1)
          [ -n "$delta" ] || report "the failing assertion did not report a colour difference" "any mean colour difference"
          python3 -c "import sys; d = float('$delta'); print('the broken badge was reported at a mean colour difference of ' + str(d)) if d > 20 else sys.exit('the failing assertion reported a mean colour difference of ' + str(d) + ', which is not a visible difference')" \
            || report "the reported colour difference was too small to be the injected fault" "more than 20"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is a deliverable, so it is run: the check asserts it answers as nonroot rather
      # than reading the Dockerfile and believing it.
      - name: the image runs as nonroot and serves the fixture app
        run: make image
      # And the suite has to work the way the chart runs it: this image, attaching to a browser
      # sidecar over the DevTools protocol. Without this, the compose file is the only place that
      # arrangement is written down.
      - name: the whole suite in containers, against a browser sidecar
        run: make compose-suite

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # Every branch is rendered and validated, including the ones a user reaches by setting one value.
      - run: ./scripts/chart-check.sh
