{{- if not .Values.scenarios.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uito.fullname" . }}-scenarios
  labels:
    {{- include "uito.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "scenarios/*.yaml" }}
  {{ base $path }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
{{- end }}
