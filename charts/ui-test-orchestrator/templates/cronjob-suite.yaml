{{- if .Values.cronJob.enabled }}
# The same suite, on a schedule. History is bounded: a suite that has been failing for a week should not
# leave a week of pods behind for somebody to read one by one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "uito.fullname" . }}-scheduled
  labels:
    {{- include "uito.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.job.backoffLimit }}
      {{- if .Values.job.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "uito.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- include "uito.podSpec" . | nindent 10 }}
{{- end }}
