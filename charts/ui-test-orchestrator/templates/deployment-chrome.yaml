{{- if .Values.chrome.enabled }}
# The browser runs beside the suite, not inside the image: a pod that ends when the suite ends, holding a
# process that has no more privilege than it needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uito.fullname" . }}-chrome
  labels:
    {{- include "uito.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "uito.name" . }}-chrome
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "uito.name" . }}-chrome
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          image: {{ include "uito.chromeImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --no-sandbox is required because the container has no user namespace to sandbox in; the pod
          # gives the process nothing else to reach, which is the trade this makes explicit.
          command: ["/bin/sh", "-c"]
          args:
            - exec chromium-browser --headless=new --no-sandbox --disable-dev-shm-usage
              --disable-background-networking --remote-debugging-address=0.0.0.0
              --remote-debugging-port={{ .Values.chrome.port }} about:blank
          ports:
            - name: cdp
              containerPort: {{ .Values.chrome.port }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
{{- end }}
