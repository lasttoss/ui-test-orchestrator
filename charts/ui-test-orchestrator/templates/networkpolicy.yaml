{{- if .Values.networkPolicy.enabled }}
# The suite talks to the application under test and to DNS, and to nothing else. A test suite with
# cluster-wide egress is a test suite that can reach the database it was never meant to touch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uito.fullname" . }}-egress
  labels:
    {{- include "uito.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "uito.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.dnsPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.dnsPort }}
    {{- if .Values.appURL }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ (urlParse .Values.appURL).port | default "80" }}
    {{- end }}
{{- end }}
